name: Build & Release 6-Platform Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # JOB 1: Build iOS & Android via Expo Application Services (EAS Cloud)
  # Runs only if EXPO_TOKEN secret is configured in repository settings
  build-mobile-expo:
    runs-on: ubuntu-latest
    if: ${{ secrets.EXPO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci || npm install
      - run: npx eas-cli build --platform all --non-interactive --no-wait

  # JOB 2: Build Web Hosting Bundle
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: npx expo export -p web
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

  # JOB 3: Build Desktop Shell via Tauri Matrix (Linux, Windows, and macOS)
  # Builds native desktop packages (.AppImage/.deb on Linux, .msi/.exe on Windows, .dmg/.app on macOS)
  build-desktop-tauri:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux GUI Dependencies for WebKitGTK & Tauri
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci || npm install
      - run: npx expo export -p web
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: "./desktop"
          tagName: ${{ github.ref_name }}
          releaseName: 'App Release ${{ github.ref_name }}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
